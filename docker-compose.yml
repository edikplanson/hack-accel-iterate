# Copilote conseiller Banque Horizon
# Front (nginx) -> Agent (FastAPI + LangGraph) -> Aiven PostgreSQL (service existant, hors compose)
#
# Local :        docker compose up --build   puis http://localhost:8080
# Aiven Runtime : ce fichier est détecté au déploiement ; la base n'est volontairement pas déclarée ici
#                 (sinon Runtime créerait un nouveau PostgreSQL). On connecte le service existant à l'app
#                 "agent" avec la variable DATABASE_URL.

services:
  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5-5}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      BANK_NAME: ${BANK_NAME:-Banque Horizon}
      PORT: "8000"
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      AGENT_URL: ${AGENT_URL:-http://agent:8000}
      PORT: "8080"
    ports:
      - "8080:8080"
    restart: unless-stopped
