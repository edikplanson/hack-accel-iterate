<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Horizon Copilot</title>
  <script src="/vendor/tailwind.js"></script>
  <script src="/vendor/chart.umd.js"></script>
  <script src="/vendor/marked.min.js"></script>
  <script src="/vendor/purify.min.js"></script>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="bg-slate-50 text-slate-800">
  <div class="h-screen flex flex-col">
    <header class="h-14 shrink-0 bg-white border-b border-slate-200 flex items-center px-5 gap-3">
      <div class="w-8 h-8 rounded-lg bg-emerald-700 text-white grid place-items-center font-semibold">H</div>
      <div class="font-semibold">Horizon Bank</div>
      <div class="text-slate-400">·</div>
      <div class="text-slate-500">Advisor copilot</div>
      <div id="status" class="ml-auto text-xs text-slate-400"></div>
    </header>

    <div class="flex-1 grid grid-cols-1 lg:grid-cols-[260px_1fr_400px] min-h-0">
      <!-- Clients -->
      <aside class="bg-white border-r border-slate-200 flex flex-col min-h-0">
        <div class="p-3 border-b border-slate-100">
          <input id="search" type="search" placeholder="Name, # or address"
                 class="w-full rounded-lg border border-slate-200 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-600/30">
        </div>
        <ul id="client-list" class="flex-1 overflow-y-auto text-sm"></ul>
      </aside>

      <!-- Dashboard -->
      <main id="dashboard" class="overflow-y-auto p-6 space-y-6">
        <div class="h-full grid place-items-center text-slate-400">Select a client to see their 360 view</div>
      </main>

      <!-- Chat -->
      <section class="bg-white border-l border-slate-200 flex flex-col min-h-0">
        <div class="p-4 border-b border-slate-100 flex items-center gap-2">
          <div class="font-semibold">Assistant</div>
          <span id="chat-client" class="text-xs text-slate-400"></span>
          <button id="brief-btn" disabled
                  class="ml-auto text-xs rounded-lg bg-emerald-700 text-white px-3 py-1.5 disabled:opacity-40">Prepare meeting</button>
        </div>
        <div id="messages" class="flex-1 overflow-y-auto p-4 space-y-4 text-sm"></div>
        <div id="suggestions" class="px-4 pb-2 flex flex-wrap gap-2"></div>
        <form id="chat-form" class="p-3 border-t border-slate-100 flex gap-2">
          <input id="chat-input" autocomplete="off" disabled placeholder="Ask a question about this client"
                 class="flex-1 rounded-lg border border-slate-200 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-600/30 disabled:bg-slate-50">
          <button class="rounded-lg bg-slate-900 text-white px-4 text-sm disabled:opacity-40" id="send-btn" disabled>Send</button>
        </form>
        <p id="chat-error" class="px-4 pb-3 text-xs text-red-600 hidden"></p>
      </section>
    </div>
  </div>
  <script src="/app.js"></script>
</body>
</html>
