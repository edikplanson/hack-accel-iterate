<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Horizon Copilot</title>
  <link rel="icon" type="image/png" href="/logo.png">
  <script src="/vendor/tailwind.js"></script>
  <script src="/vendor/chart.umd.js"></script>
  <script src="/vendor/marked.min.js"></script>
  <script src="/vendor/purify.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap">
  <link rel="stylesheet" href="/style.css">
</head>
<body class="text-slate-800">
  <div class="h-screen flex flex-col">
    <header class="app-header h-16 shrink-0 flex items-center px-5 gap-3">
      <img src="/logo.png" alt="Horizon Bank" class="w-10 h-10">
      <div class="leading-tight">
        <div class="brand-name">Horizon Bank</div>
        <div class="brand-sub">Private advisory · Advisor copilot</div>
      </div>
      <div id="status" class="status-pill ml-auto"></div>
    </header>

    <div class="flex-1 grid grid-cols-1 lg:grid-cols-[260px_1fr_400px] min-h-0">
      <!-- Clients -->
      <aside class="panel border-r flex flex-col min-h-0">
        <div class="p-4 pb-3">
          <div class="panel-eyebrow mb-2">Client portfolio</div>
          <input id="search" type="search" placeholder="Name, # or address" class="field w-full">
        </div>
        <ul id="client-list" class="flex-1 overflow-y-auto text-sm"></ul>
      </aside>

      <!-- Dashboard -->
      <main id="dashboard" class="overflow-y-auto p-6 space-y-6">
        <div class="h-full grid place-items-center text-center">
          <div>
            <img src="/logo.png" alt="" class="w-20 h-20 mx-auto">
            <div class="hero-name mt-3">Welcome back</div>
            <div class="text-sm text-slate-500 mt-1">Select a client to open their 360° view</div>
          </div>
        </div>
      </main>

      <!-- Chat -->
      <section class="panel border-l flex flex-col min-h-0">
        <div class="chat-head p-4 flex items-center gap-3">
          <div class="leading-tight min-w-0">
            <div class="panel-title">Assistant</div>
            <div id="chat-client" class="text-xs text-slate-500 truncate"></div>
          </div>
          <button id="brief-btn" disabled class="btn-gold ml-auto">Prepare meeting</button>
        </div>
        <div id="messages" class="flex-1 overflow-y-auto p-4 space-y-4 text-sm"></div>
        <div id="suggestions" class="px-4 pb-2 flex flex-wrap gap-2"></div>
        <form id="chat-form" class="chat-form p-3 flex gap-2">
          <input id="chat-input" autocomplete="off" disabled placeholder="Ask a question about this client" class="field flex-1">
          <button class="btn-primary" id="send-btn" disabled>Send</button>
        </form>
        <p id="chat-error" class="px-4 pb-3 text-xs text-red-600 hidden"></p>
      </section>
    </div>
  </div>
  <script src="/app.js"></script>
</body>
</html>
